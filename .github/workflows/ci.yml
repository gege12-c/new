name: CI

# À chaque push, sur toutes les branches : une branche de travail est vérifiée avant sa fusion dans main.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run watch:check
      - run: npm run build

  # Le fichier de mise à jour de la production (supabase/production/pending.sql) s'applique en une
  # seule fois sur la pile Supabase officielle, remise au niveau de la production actuelle.
  production-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Keep only the migrations already applied in production
        run: |
          mkdir -p "$RUNNER_TEMP/pending"
          for f in supabase/migrations/*.sql; do
            v="$(basename "$f" | cut -c1-14)"
            grep -qx "$v" supabase/production/applied.txt || mv "$f" "$RUNNER_TEMP/pending/"
          done
          ls supabase/migrations "$RUNNER_TEMP/pending"
      - name: Start Supabase at the production level
        run: supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply the production SQL file (one transaction)
        run: |
          test -f supabase/production/pending.sql || { echo "Rien à appliquer."; exit 0; }
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f supabase/production/pending.sql
      - name: Check the recorded migrations
        run: |
          expected="$(ls "$RUNNER_TEMP/pending" | cut -c1-14 | sort)"
          recorded="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -At -c "select version from supabase_migrations.schema_migrations order by version" | sort)"
          for v in $expected; do echo "$recorded" | grep -qx "$v" || { echo "::error::migration $v non inscrite"; exit 1; }; done
          echo "Inscrites : $expected"

  # Parcours clés dans un vrai navigateur, contre la pile Supabase officielle (Docker) :
  # critère de la phase 2 (une séance publiée apparaît chez l'athlète sans rechargement, grâce
  # à Supabase Realtime) et de la phase 3 (une activité Strava arrive par webhook, sans doublon,
  # rattachée à la bonne séance), contre un faux Strava lancé par les tests (données fictives).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STRAVA_CLIENT_ID: "4242"
      STRAVA_CLIENT_SECRET: fake-client-secret
      STRAVA_API_BASE_URL: http://127.0.0.1:4010/api/v3
      STRAVA_OAUTH_BASE_URL: http://127.0.0.1:4010/oauth
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - name: Start Supabase (Postgres, Auth, REST, Realtime)
        run: supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Point the app at the local stack
        run: |
          supabase status -o env --agent no > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          # Valeurs jetables, propres à cette exécution.
          key="$(openssl rand -base64 32)"; echo "::add-mask::$key"; echo "TOKEN_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
          cron="$(openssl rand -hex 24)"; echo "::add-mask::$cron"; echo "CRON_SECRET=$cron" >> "$GITHUB_ENV"
      - name: Integration tests (Strava pipeline, data loaders)
        run: npx vitest run --project integration --reporter=default --reporter=github-actions
      # Les parcours de bout en bout tournent même si les tests d'intégration échouent.
      - run: npm run build
        if: ${{ !cancelled() }}
      - name: Start the app
        if: ${{ !cancelled() }}
        run: |
          nohup npm run start -- -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - name: Playwright (temps réel compris)
        if: ${{ !cancelled() }}
        run: npm run test:e2e
        env:
          E2E_REALTIME: "1"
      - name: Logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/next.log" || true
          docker logs supabase_realtime_tri-coach --tail 200 || true
      - name: Keep traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
