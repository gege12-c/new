<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1a2b" />
    <title>Hors connexion – TriCoach</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f5f8;
        --surface: #ffffff;
        --ink: #0e1a2b;
        --muted: #5b6b80;
        --line: #dfe5ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a1220;
          --surface: #101b2e;
          --ink: #e8eef6;
          --muted: #8e9db2;
          --line: #22324b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .mark { display: inline-flex; align-items: flex-end; gap: 3px; height: 22px; }
      .mark span { width: 6px; border-radius: 2px; }
      h1 { margin: 18px 0 6px; font-size: 22px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      button {
        margin-top: 20px;
        height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #3ba6ee; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <span style="height: 10px; background: #3ba6ee"></span>
        <span style="height: 16px; background: #f2b632"></span>
        <span style="height: 22px; background: #f2666b"></span>
      </span>
      <h1>Pas de connexion</h1>
      <p>TriCoach a besoin du réseau pour afficher vos séances à jour. Vérifiez votre connexion, puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
